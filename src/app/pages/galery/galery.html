<div class="container mt-4">
  <div class="row">
    @for (image of imagenes; track image.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <img [src]="image.imagen" class="card-img-top" [alt]="image.nombre">
          <div class="card-body">
            <h5 class="card-title">{{ image.nombre }}</h5>
            <p class="card-text">{{ image.descripcion }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
